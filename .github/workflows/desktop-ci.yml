name: Desktop CI

on:
  push:
    branches:
      - desktop-pyside6
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m compileall -q desktop/src

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run unit tests
        env:
          PYTHONPATH: desktop/src
        run: python -m pytest -q desktop/tests
