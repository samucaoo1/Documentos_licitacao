[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "documentos-licitacao"
version = "0.1.0"
description = "Aplicativo desktop para emissão assistida de certidões de licitantes."
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7"]

[project.scripts]
documentos-licitacao = "documentos_licitacao.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
